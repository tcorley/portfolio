# This is the public, canonical resume. Replace the placeholders after importing
# your current resume; keep every claim here defensible and sourceable.
#
# RenderCV validates this file and compiles it to a publication-quality PDF.

cv:
  name: Your Name
  headline: Role or professional focus
  location: City, Region
  email: you@example.com
  website: https://your-site.example
  social_networks:
    - network: LinkedIn
      username: your-handle
    - network: GitHub
      username: your-handle
  sections:
    summary:
      - Evidence-led professional summary that explains the work you want to be known for.
    experience:
      - company: Your Company
        position: Your Role
        location: City, Region
        start_date: 2023-01
        end_date: present
        highlights:
          - "Lead with outcomes: what changed, how you contributed, and the measurable result."
          - "Keep bullets specific enough to tailor later, without overstating scope or ownership."
    selected_projects:
      - name: A project worth showing
        date: 2024
        highlights:
          - A concise accomplishment, link, or technical proof point.
    education:
      - institution: University or school
        area: Field of study
        degree: Degree
        start_date: 2016-09
        end_date: 2020-05

design:
  theme: moderncv
  page:
    size: us-letter
    top_margin: 0.65in
    bottom_margin: 0.65in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: false
  colors:
    name: rgb(25, 55, 109)
    headline: rgb(25, 55, 109)
    section_titles: rgb(25, 55, 109)
    connections: rgb(25, 55, 109)
    links: rgb(25, 55, 109)
  typography:
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10pt
      name: 25pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.4em
    line_spacing: 0.6em
    alignment: justified

settings:
  bold_keywords: []
