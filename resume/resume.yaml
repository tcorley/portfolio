design:
  theme: folio
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.58in
    right_margin: 0.58in
    show_footer: true
    show_top_note: false
  colors:
    body: rgb(29, 38, 48)
    name: rgb(23, 42, 58)
    headline: rgb(23, 42, 58)
    section_titles: rgb(23, 42, 58)
    connections: rgb(255, 255, 255)
    links: rgb(214, 78, 55)
    footer: rgb(105, 116, 119)
    top_note: rgb(105, 116, 119)
  typography:
    font_family:
      body: Open Sauce Sans
      name: EB Garamond
      headline: Open Sauce Sans
      connections: Open Sauce Sans
      section_titles: Open Sauce Sans
    font_size:
      body: 9.5pt
      name: 38pt
      headline: 10pt
      connections: 8.6pt
      section_titles: 10.5pt
    line_spacing: 0.58em
    alignment: left
    bold:
      name: true
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: left
    space_below_name: 0.2cm
    space_below_headline: 0cm
    space_below_connections: 0.3cm
    connections:
      show_icons: true
      separator: ""
      space_between_connections: 0.45cm
  section_titles:
    type: without_line
    space_above: 0.4cm
    space_below: 0.2cm
  sections:
    space_between_regular_entries: 0.8em
    space_between_text_based_entries: 0.25em
    show_time_spans_in: []
  entries:
    date_and_location_width: 1.45in
    side_space: 0cm
    space_between_columns: 0.3cm
    allow_page_break: false
    short_second_row: false
    summary:
      space_above: 0.05cm
    highlights:
      bullet: "•"
      nested_bullet: "◦"
      space_left: 0cm
      space_above: 0.08cm
      space_between_items: 0.06cm
      space_between_bullet_and_text: 0.45em
  templates:
    footer: "PAGE_NUMBER"
    date_range: "START_DATE - END_DATE"
    education_entry:
      main_column: "**INSTITUTION**\nDEGREE_WITH_AREA"
      date_and_location_column: DATE
      degree_column: null
    experience_entry:
      main_column: "ROLE\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE

settings:
  bold_keywords: []
