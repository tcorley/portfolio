name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main  # or master, depending on your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      # Opt into Node.js 24 for JavaScript actions before GitHub forces it by default.
      # This workflow currently uses `cloudflare/wrangler-action@v3`, which is pinned
      # to a Node 20 runtime inside its `action.yml`.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Render default resume PDF
        run: make -C resume render VARIANT=default

      - name: Publish resume for the site
        run: cp resume/build/resume.pdf public/resume.pdf

      - name: Build React Router app
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}